name: Build GUI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: github-actions

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux-x86_64
          - os: windows-2022
            package: windows
          - os: macos-latest
            package: macos-universal

    env:
      BUILD_PROFILE: ${{ github.ref_name == 'dev' && 'fast_release' || 'release' }}
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gui-

      - name: Setup Rust environment
        uses: raftario/setup-rust-action@v1.0.0
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Install Linux build deps
        run: |
          sudo apt update
          sudo apt install --yes \
            libdbus-1-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libwayland-egl1 \
            libgles2-mesa-dev

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Install MSVC ARM64 Build Tools
        shell: powershell
        run: |
          $installerPath = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          Start-Process $installerPath -ArgumentList "modify --installPath `"$installPath`" --quiet --add Microsoft.VisualStudio.Component.VC.ARM64.BuildTools.Latest" -Wait -PassThru

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Add Windows ARM64 target
        run: rustup target add aarch64-pc-windows-msvc

      - if: ${{ matrix.os == 'macos-latest' }}
        name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build native binary
        if: ${{ matrix.os != 'macos-latest' }}
        run: cargo build --locked -p nitro_gui --profile "${{ env.BUILD_PROFILE }}"

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Build Windows ARM64 binary
        run: cargo build --locked -p nitro_gui --profile "${{ env.BUILD_PROFILE }}" --target aarch64-pc-windows-msvc

      - if: ${{ matrix.os == 'macos-latest' }}
        name: Build macOS binaries
        run: |
          cargo build --locked -p nitro_gui --profile "${{ env.BUILD_PROFILE }}" --target x86_64-apple-darwin
          cargo build --locked -p nitro_gui --profile "${{ env.BUILD_PROFILE }}" --target aarch64-apple-darwin

      - name: Package with cargo-packager (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          # Install cargo-packager (from the requested repo) and run it to produce .deb and AppImage
          cargo install --git https://github.com/crabnebula-dev/cargo-packager cargo-packager || true
          cargo-packager --manifest-path crates/gui/Cargo.toml --binaries-dir target/${{ env.BUILD_PROFILE }} \
            --output dist --product Nitrolaunch --version 0.31.0 \
            --desktop crates/gui/assets/Nitrolaunch.desktop --icon crates/gui/assets/icon_1024x1024.png \
            --formats deb,appimage

      - name: Package with cargo-packager (Windows x64)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: powershell
        run: |
          # Install cargo-packager and produce exe+msi
          cargo install --git https://github.com/crabnebula-dev/cargo-packager cargo-packager || true
          cargo-packager --manifest-path crates/gui/Cargo.toml --binaries-dir target/${{ env.BUILD_PROFILE }} \
            --output dist --product Nitrolaunch --version 0.31.0 \
            --icon crates/gui/assets/icon.ico --desktop crates/gui/assets/Nitrolaunch.desktop \
            --formats exe,msi

      - name: Package with cargo-packager (Windows ARM64)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: powershell
        run: |
          cargo install --git https://github.com/crabnebula-dev/cargo-packager cargo-packager || true
          cargo-packager --manifest-path crates/gui/Cargo.toml --binaries-dir target/aarch64-pc-windows-msvc/${{ env.BUILD_PROFILE }} \
            --output dist --product Nitrolaunch --version 0.31.0 \
            --icon crates/gui/assets/icon.ico --desktop crates/gui/assets/Nitrolaunch.desktop \
            --formats exe

      - name: Package with cargo-packager (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          cargo install --git https://github.com/crabnebula-dev/cargo-packager cargo-packager || true
          mkdir -p tmp_pack/bin
          lipo -create \
            "target/x86_64-apple-darwin/${{ env.BUILD_PROFILE }}/nitro_gui" \
            "target/aarch64-apple-darwin/${{ env.BUILD_PROFILE }}/nitro_gui" \
            -output tmp_pack/bin/nitro_gui
          chmod +x tmp_pack/bin/nitro_gui
          cargo-packager --manifest-path crates/gui/Cargo.toml --binaries-dir tmp_pack/bin \
            --output dist --product Nitrolaunch --version 0.31.0 \
            --icon crates/gui/assets/icon.icns --desktop crates/gui/assets/Nitrolaunch.desktop \
            --formats app,dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*-x86_64.AppImage
